<script>
  // GitHub Pages has no server-side rewrites, so a deep link like /work/foo
  // 404s. public/404.html encodes the path into a query string and bounces here;
  // this restores the real URL before React Router mounts. Pairs with 404.html.
  (function (l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&')
      }).join('?')
      window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
    }
  }(window.location))
</script>

</body>
